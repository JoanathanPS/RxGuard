name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install shared package and all services
        run: |
          python -m pip install --upgrade pip
          pip install -e shared
          for d in services/*-service; do pip install -e "$d"; done
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check shared services

      - name: Test (pytest)
        run: pytest shared services